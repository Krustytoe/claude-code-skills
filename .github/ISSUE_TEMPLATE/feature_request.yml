name: Feature request
description: Suggest a new capability or a change to existing behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what's getting in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Inputs/outputs, defaults, example usage.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: compliance
    attributes:
      label: Security / compliance impact
      description: Does this change a secure default, or affect FedRAMP / NIST 800-53 alignment?
