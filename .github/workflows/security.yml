name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, catches newly published advisories

permissions:
  contents: read

jobs:
  trivy:
    uses: Krustytoe/platform-workflows/.github/workflows/trivy-scan.yml@fc940724641b69f16de4ce5ac0a8aaf5a3af9375 # v0.2.0
    permissions:
      contents: read
      security-events: write
    with:
      scan_type: fs
      target: .
      severity: HIGH,CRITICAL
