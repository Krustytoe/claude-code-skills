name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, catches newly published advisories

permissions:
  contents: read

jobs:
  trivy:
    uses: Krustytoe/platform-workflows/.github/workflows/trivy-scan.yml@f2a4e913b08e48bc88127015c7083cf99c5f48d0 # v0.3.0
    permissions:
      contents: read
      security-events: write
    with:
      scan_type: fs
      target: .
      severity: HIGH,CRITICAL
